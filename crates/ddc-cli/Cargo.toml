[package]
name = "ddc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ddc command-line interface"

[[bin]]
name = "ddc"
path = "src/main.rs"

[dependencies]
ddc-dex = { workspace = true }
ddc-dec = { workspace = true }
anyhow = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["zlib-ng"] }
memchr = "2"
memmap2 = "0.9"
mimalloc = "0.1.52"
