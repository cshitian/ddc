[workspace]
resolver = "2"
members = ["crates/ddc-dex", "crates/ddc-dec", "crates/ddc-cli"]

[workspace.package]
version = "0.1.8"
edition = "2021"
license = "MIT"
repository = "https://github.com/ejfkdev/ddc"
homepage = "https://github.com/ejfkdev/ddc"
readme = "README.md"
keywords = ["decompiler", "dex", "dalvik", "android", "reverse-engineering"]
categories = ["command-line-utilities", "development-tools::debugging"]

[workspace.dependencies]
ddc-dex = { path = "crates/ddc-dex", version = "0.2.2" }
ddc-dec = { path = "crates/ddc-dec", version = "0.1.8" }
jdc-core = "0.2.3"
anyhow = "1"

[profile.release]
debug = true
lto = "fat"
codegen-units = 1

# Local dev pin for jdc-core changes (REMOVE before publishing — the
# released ddc builds against the registry crate).
[patch.crates-io]
jdc-core = { path = "../jdc-core" }


